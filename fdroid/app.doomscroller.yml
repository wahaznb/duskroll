AutoName: Doomscroller
Summary: Break reminder after continuous scrolling
Description: |-
  Doomscroller watches for scroll gestures and shows a full-screen break
  reminder after continuous scrolling (default 10 minutes).

  * 100% offline, no trackers, no internet permission
  * AccessibilityService sees only THAT a scroll happened, never content
  * Configurable threshold, idle timeout, and snooze
  * GPL-3.0-or-later

